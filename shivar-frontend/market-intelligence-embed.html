<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Intelligence</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --leaf: #15803d;
        --lime: #22c55e;
        --leaf-deep: #14532d;
        --gold: #ff9933;
        --gold-deep: #b35f00;
        --blue: #2563eb;
        --cream: #17352a;
        --muted: #526b61;
        --line: rgba(21, 128, 61, 0.18);
        --card: #ffffff;
        --field: rgba(220, 252, 231, 0.6);
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: transparent;
        color: var(--cream);
        padding: 1.5rem 1.7rem 2.5rem;
      }
      h3 {
        font-family: "Playfair Display", serif;
        font-size: 1.15rem;
        color: var(--leaf-deep);
        margin-bottom: 0.3rem;
      }
      .hint {
        font-size: 0.83rem;
        color: var(--muted);
        margin-bottom: 1.2rem;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.9rem;
        margin-bottom: 0.3rem;
      }
      .form-grid label {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
      }
      .form-grid input,
      .form-grid select {
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        padding: 0.6rem 0.75rem;
        border-radius: 8px;
        border: 1.3px solid var(--line);
        background: var(--field);
        color: var(--cream);
      }
      .form-grid input:focus,
      .form-grid select:focus {
        outline: 2px solid var(--lime);
        border-color: transparent;
      }

      .submit-row {
        grid-column: 1/-1;
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 0.4rem;
      }
      .btn-est {
        font-family: "DM Sans", sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        color: #fff;
        background: linear-gradient(135deg, var(--leaf), var(--lime));
        border: none;
        padding: 0.75rem 1.6rem;
        border-radius: 10px;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .btn-est:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(21, 128, 61, 0.3);
      }
      .btn-est:disabled {
        opacity: 0.6;
        cursor: wait;
        transform: none;
        box-shadow: none;
      }
      .status-msg {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .status-msg.error {
        color: #b91c1c;
      }

      .price-res-box {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 1rem;
        margin-top: 1.4rem;
      }
      .stat-card {
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.1rem;
        text-align: center;
      }
      .stat-card .title {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.3rem;
        letter-spacing: 0.4px;
      }
      .stat-card .value {
        font-size: 1.5rem;
        font-weight: 900;
        color: var(--leaf-deep);
      }
      .stat-card .sub {
        font-size: 0.73rem;
        color: var(--muted);
        margin-top: 0.25rem;
      }

      /* Range bar */
      .range-wrap {
        margin-top: 1.3rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.1rem 1.3rem;
      }
      .range-wrap .rw-title {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 0.8rem;
        letter-spacing: 0.4px;
      }
      .range-track {
        position: relative;
        height: 10px;
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          rgba(21, 128, 61, 0.15),
          rgba(34, 197, 94, 0.4),
          rgba(21, 128, 61, 0.15)
        );
        margin: 1.4rem 0.3rem 1.6rem;
      }
      .range-marker {
        position: absolute;
        top: 50%;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      }
      .range-marker.estimate {
        background: var(--leaf-deep);
        z-index: 2;
      }
      .range-marker.baseline {
        background: var(--gold);
        z-index: 1;
      }
      .range-marker .rm-label {
        position: absolute;
        top: -26px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.68rem;
        font-weight: 700;
        white-space: nowrap;
      }
      .range-marker.estimate .rm-label {
        color: var(--leaf-deep);
      }
      .range-marker.baseline .rm-label {
        color: var(--gold-deep);
      }
      .range-endpoints {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--muted);
        font-weight: 600;
      }
      .range-legend {
        display: flex;
        gap: 1.2rem;
        margin-top: 0.6rem;
        font-size: 0.72rem;
        color: var(--muted);
      }
      .range-legend span {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
      }

      .confidence-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.35rem 0.8rem;
        border-radius: 99px;
        background: rgba(255, 153, 51, 0.18);
        color: var(--gold-deep);
        margin-top: 1rem;
      }
      .confidence-note {
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.5;
        margin-top: 0.6rem;
      }

      .tips-card {
        margin-top: 1.3rem;
        background: var(--field);
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 1rem 1.2rem;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.55;
      }
      .tips-card b {
        color: var(--leaf-deep);
      }

      .history-wrap {
        margin-top: 1.6rem;
      }
      .history-wrap .rw-title {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 0.6rem;
        letter-spacing: 0.4px;
      }
      table.hist-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      table.hist-table th {
        text-align: left;
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0.5rem 0.6rem;
        border-bottom: 1px solid var(--line);
      }
      table.hist-table td {
        padding: 0.6rem 0.6rem;
        border-bottom: 1px solid rgba(21, 128, 61, 0.08);
      }
      table.hist-table tr:hover td {
        background: var(--field);
      }
      .empty-hist {
        font-size: 0.8rem;
        color: var(--muted);
        padding: 0.8rem 0;
      }
    </style>
  </head>
  <body>
    <h3>AI Price Estimate & Market Range</h3>
    <p class="hint">
      Select your crop and location to get a model-estimated price alongside the
      typical market band, so you know what a fair offer looks like.
    </p>

    <form class="form-grid" id="price-form">
      <label
        ><span>Crop</span>
        <select id="p-crop" required></select>
      </label>
      <label
        ><span>Variety (optional)</span>
        <input id="p-variety" type="text" placeholder="e.g. Bt Cotton" />
      </label>
      <label
        ><span>District</span>
        <input id="p-district" type="text" placeholder="e.g. Nashik" required />
      </label>
      <label
        ><span>Quantity (tonnes)</span>
        <input
          id="p-qty"
          type="number"
          min="0.1"
          step="0.1"
          value="5"
          required
        />
      </label>
      <div class="submit-row">
        <button type="submit" class="btn-est" id="p-btn">
          🔍 Estimate Price
        </button>
        <span class="status-msg" id="p-status"></span>
      </div>
    </form>

    <div id="price-results"></div>

    <div class="history-wrap">
      <div class="rw-title">This Session's Estimates</div>
      <div id="history-body">
        <div class="empty-hist">
          Run an estimate above to start building a comparison table.
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      // Goes through the Node backend (server.js -> routes/price.js -> price service on 8002)
      const API_BASE = params.get("api") || "http://localhost:5000/api/price";

      const CROPS = [
        "Areca Nut",
        "Bajra",
        "Banana",
        "Cashew",
        "Chickoo",
        "Coconut",
        "Cotton",
        "Field Beans",
        "Gram",
        "Groundnut",
        "Jowar",
        "Linseed",
        "Maize",
        "Mango (Alphonso)",
        "Ragi",
        "Rice",
        "Soybean",
        "Sugarcane",
        "Sunflower",
        "Tur",
        "Turmeric",
        "Udid",
        "Vari",
        "Wheat",
      ];

      function fillSelect(el, values) {
        el.innerHTML = values
          .map((v) => `<option value="${v}">${v}</option>`)
          .join("");
      }
      fillSelect(document.getElementById("p-crop"), CROPS);

      const priceForm = document.getElementById("price-form");
      const priceStatus = document.getElementById("p-status");
      const priceResults = document.getElementById("price-results");
      const priceBtn = document.getElementById("p-btn");
      const history = [];

      priceForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        priceBtn.disabled = true;
        priceStatus.textContent = "Calculating...";
        priceStatus.classList.remove("error");

        const payload = {
          crop: document.getElementById("p-crop").value,
          variety:
            document.getElementById("p-variety").value || "Not Specified",
          district: document.getElementById("p-district").value,
          quantity_tonnes: parseFloat(document.getElementById("p-qty").value),
        };

        try {
          const res = await fetch(`${API_BASE}/estimate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          renderPriceResults(data, payload);
        } catch (err) {
          priceStatus.textContent = "Could not reach the price service.";
          priceStatus.classList.add("error");
          console.error(err);
        } finally {
          priceBtn.disabled = false;
          setTimeout(() => (priceStatus.textContent = ""), 1200);
        }
      });

      function renderPriceResults(d, payload) {
        if (d.error) {
          priceResults.innerHTML = `<div class="tips-card" style="color:#B91C1C;border-color:#B91C1C;">${d.error}</div>`;
          return;
        }
        const low = d.typical_price_range_per_quintal.low;
        const high = d.typical_price_range_per_quintal.high;
        const baseline = d.baseline_crop_average_per_quintal;
        const estimate = d.model_estimate_per_quintal;
        const modelVal =
          estimate != null
            ? `₹${estimate.toLocaleString("en-IN")}`
            : "Baseline Only";

        // Position markers on the range bar (clipped 4-96% so they stay visible)
        const span = high - low || 1;
        const clip = (p) => Math.max(4, Math.min(96, p));
        const basePct = clip(((baseline - low) / span) * 100);
        const estPct =
          estimate != null ? clip(((estimate - low) / span) * 100) : null;

        priceResults.innerHTML = `
      <div class="price-res-box">
        <div class="stat-card">
          <div class="title">Model Estimate</div>
          <div class="value">${modelVal}</div>
          <div class="sub">per quintal</div>
        </div>
        <div class="stat-card">
          <div class="title">Historical Crop Average</div>
          <div class="value">₹${baseline.toLocaleString("en-IN")}</div>
          <div class="sub">per quintal</div>
        </div>
        <div class="stat-card">
          <div class="title">Sample Size</div>
          <div class="value">${d.sample_size_for_this_crop}</div>
          <div class="sub">historical listings</div>
        </div>
      </div>

      <div class="range-wrap">
        <div class="rw-title">Typical Market Range</div>
        <div class="range-track">
          <div class="range-marker baseline" style="left:${basePct}%"><span class="rm-label">Avg</span></div>
          ${estPct !== null ? `<div class="range-marker estimate" style="left:${estPct}%"><span class="rm-label">Est.</span></div>` : ""}
        </div>
        <div class="range-endpoints"><span>₹${low.toLocaleString("en-IN")}</span><span>₹${high.toLocaleString("en-IN")}</span></div>
        <div class="range-legend">
          <span><i class="dot" style="background:var(--gold)"></i> Historical average</span>
          ${estPct !== null ? `<span><i class="dot" style="background:var(--leaf-deep)"></i> Model estimate</span>` : ""}
        </div>
      </div>

      <div class="confidence-chip">⚠️ Low Confidence — treat range as more reliable than the point estimate</div>
      <div class="confidence-note">${d.confidence}</div>

      <div class="tips-card">
        <b>How to use this:</b> Prices for this crop are driven mostly by crop identity rather than variety, district, or quantity — so the shaded range is your best guide to a fair deal, not the single number. When negotiating with a buyer, anchor to the middle of the range and check today's local mandi rate if one is available before accepting an offer well outside it.
      </div>
    `;

        history.unshift({
          ...payload,
          ...d,
          ts: new Date().toLocaleTimeString("en-IN", {
            hour: "2-digit",
            minute: "2-digit",
          }),
        });
        renderHistory();
      }

      function renderHistory() {
        const el = document.getElementById("history-body");
        if (!history.length) {
          el.innerHTML =
            '<div class="empty-hist">Run an estimate above to start building a comparison table.</div>';
          return;
        }
        el.innerHTML = `
      <table class="hist-table">
        <thead><tr><th>Time</th><th>Crop</th><th>District</th><th>Qty (t)</th><th>Estimate</th><th>Range</th></tr></thead>
        <tbody>
          ${history
            .slice(0, 8)
            .map(
              (h) => `
            <tr>
              <td>${h.ts}</td>
              <td>${h.crop}</td>
              <td>${h.district}</td>
              <td>${h.quantity_tonnes}</td>
              <td>${h.model_estimate_per_quintal != null ? "₹" + h.model_estimate_per_quintal.toLocaleString("en-IN") : "—"}</td>
              <td>₹${h.typical_price_range_per_quintal.low.toLocaleString("en-IN")} – ₹${h.typical_price_range_per_quintal.high.toLocaleString("en-IN")}</td>
            </tr>
          `,
            )
            .join("")}
        </tbody>
      </table>
    `;
      }
    </script>
  </body>
</html>
